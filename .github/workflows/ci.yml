name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Run tests with race detector
        working-directory: source
        run: go test -race ./...

      - name: Run static checks
        working-directory: source
        run: go vet ./...

      - name: Build CLI
        run: bash source/build.sh
