{{define "edit"}}{{template "page_head" .}}
<h1>编辑笔记</h1>
<p class="exp-path">{{.Exp.Path}}</p>
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
<form class="note-form" method="post" action="{{.Action}}">
  <input type="hidden" name="version" value="{{.Version}}">
  <label class="sr-only" for="content">笔记内容（Markdown 原文）</label>
  <textarea id="content" name="content" rows="24" spellcheck="false">{{.Content}}</textarea>
  <div class="form-actions">
    <button type="submit">保存</button>
    <a class="button secondary" href="{{.Exp.URL}}">取消</a>
  </div>
</form>
<p class="hint">笔记按 Markdown 原文保存，网页只做纯文本展示，不渲染。</p>
{{template "page_foot" .}}{{end}}
