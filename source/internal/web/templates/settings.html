{{define "settings"}}
<dialog id="settings-dialog" class="dialog" aria-labelledby="settings-title"><div class="dialog-header"><div><p class="dialog-kicker">PREFERENCES</p><h2 id="settings-title">设置</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭设置">×</button></div><div class="dialog-body"><section><h3>外观</h3><p>选择适合当前环境的黑白主题。</p><div class="theme-options"><label><input type="radio" name="theme" value="light"> 浅色</label><label><input type="radio" name="theme" value="dark"> 深色</label></div></section><section><h3>网页操作日志</h3><p>记录网页中执行的重要操作及结果，不包含笔记正文和访问令牌。</p><a class="btn" href="/activity" target="_blank" rel="noopener" hx-boost="false">查看日志 ↗</a></section></div></dialog>
<dialog id="rename-dialog" class="dialog" aria-labelledby="rename-title"><div class="dialog-header"><div><p class="dialog-kicker">EXPERIMENT</p><h2 id="rename-title">重命名实验</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭">×</button></div><form id="rename-form" class="dialog-body" method="post" hx-boost="false"><label for="rename-path">新的实验路径</label><input id="rename-path" name="path" required><p>已挂载的工作树保留原目录；分支和实验记录会同步更新。</p><div class="dialog-actions"><button type="button" class="btn" data-close-dialog>取消</button><button type="submit" class="btn btn-primary">保存</button></div></form></dialog>
{{end}}
