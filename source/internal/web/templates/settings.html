{{define "settings"}}
<dialog id="settings-dialog" class="dialog" aria-labelledby="settings-title"><div class="dialog-header"><div><p class="dialog-kicker">PREFERENCES</p><h2 id="settings-title">设置</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭设置">×</button></div><div class="dialog-body"><section><h3>外观</h3><p>选择适合当前环境的黑白主题。</p><div class="theme-options"><label><input type="radio" name="theme" value="light"> 浅色</label><label><input type="radio" name="theme" value="dark"> 深色</label></div></section><section><h3>网页操作日志</h3><p>记录网页中执行的重要操作及结果，不包含笔记正文和访问令牌。</p><a class="btn" href="/activity" target="_blank" rel="noopener" hx-boost="false">查看日志 ↗</a></section></div></dialog>
<dialog id="rename-dialog" class="dialog" aria-labelledby="rename-title"><div class="dialog-header"><div><p class="dialog-kicker">EXPERIMENT</p><h2 id="rename-title">重命名实验</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭">×</button></div><form id="rename-form" class="dialog-body" method="post" hx-boost="false"><label for="rename-path">新的实验路径</label><input id="rename-path" name="path" required><p>已挂载的工作树保留原目录；分支和实验记录会同步更新。</p><div class="dialog-actions"><button type="button" class="btn" data-close-dialog>取消</button><button type="submit" class="btn btn-primary">保存</button></div></form></dialog>

<dialog id="create-dialog" class="dialog" aria-labelledby="create-title"><div class="dialog-header"><h2 id="create-title">新建实验</h2><button type="button" class="icon-button" data-close-dialog aria-label="关闭">×</button></div><form class="dialog-body dialog-form" method="post" action="/new"><label>实验路径<input name="path" placeholder="例如 ablation/sigreg" required></label><label>实验假设<textarea name="why" rows="3" placeholder="你想验证什么？" required></textarea></label><div class="dialog-actions"><button type="button" class="btn" data-close-dialog>取消</button><button class="btn btn-primary" type="submit">创建实验</button></div></form></dialog>
<dialog id="adopt-dialog" class="dialog" aria-labelledby="adopt-title"><div class="dialog-header"><h2 id="adopt-title">收编分支</h2><button type="button" class="icon-button" data-close-dialog aria-label="关闭">×</button></div><form class="dialog-body dialog-form" method="post" action="/adopt"><label>分支<input name="branch" placeholder="exp/ablation/sigreg" required></label><label>假设<input name="why" placeholder="可选"></label><div class="dialog-actions"><button type="button" class="btn" data-close-dialog>取消</button><button class="btn btn-primary" type="submit">收编分支</button></div></form></dialog>
<dialog id="restore-dialog" class="dialog" aria-labelledby="restore-title"><div class="dialog-header"><h2 id="restore-title">恢复记录</h2><button type="button" class="icon-button" data-close-dialog aria-label="关闭">×</button></div><form class="dialog-body dialog-form" method="post" action="/restore"><p>从 book 分支恢复实验记录。</p><label class="check"><input type="checkbox" name="force" value="1">覆盖已有记录</label><div class="dialog-actions"><button type="button" class="btn" data-close-dialog>取消</button><button class="btn btn-primary" type="submit">恢复</button></div></form></dialog>
<dialog id="conclude-dialog" class="dialog" aria-labelledby="conclude-title"><div class="dialog-header"><h2 id="conclude-title">结案实验</h2><button type="button" class="icon-button" data-close-dialog aria-label="关闭">×</button></div><form id="conclude-form" class="dialog-body dialog-form" method="post" hx-boost="false"><label>结论<select name="decision"><option value="keep">保留</option><option value="abandon">放弃</option></select></label><label>原因<input name="why" placeholder="写下结论或原因" required></label><div class="dialog-actions"><button type="button" class="btn" data-close-dialog>取消</button><button class="btn btn-primary" type="submit">确认结案</button></div></form></dialog>
{{end}}
